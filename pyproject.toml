[project]
name = "pr-risk"
version = "0.1.0"
description = "Evidence-backed PR risk analyzer for C++/CMake repositories"
requires-python = ">=3.11"
dependencies = [
    "typer",
    "rich",
    "gitpython"
]

[project.scripts]
pr-risk = "pr_risk.cli:app"

[tool.pytest.ini_options]
pythonpath = ["src"]